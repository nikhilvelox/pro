spring.application.name=Api-Gateway
server.port=8081

spring.data.redis.host=localhost
spring.data.redis.port=6379


# Route 1: User Service
spring.cloud.gateway.server.webflux.routes[0].id=user-service-route
spring.cloud.gateway.server.webflux.routes[0].uri=lb://user-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/v1/api/home/user/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=3

spring.cloud.gateway.server.webflux.routes[0].filters[1].name=RequestRateLimiter
spring.cloud.gateway.server.webflux.routes[0].filters[1].args[key-resolver]=#{@ipKeyResolver}
spring.cloud.gateway.server.webflux.routes[0].filters[1].args[redis-rate-limiter.replenishRate]=5
spring.cloud.gateway.server.webflux.routes[0].filters[1].args[redis-rate-limiter.burstCapacity]=5
spring.cloud.gateway.server.webflux.routes[0].filters[1].args[redis-rate-limiter.requestedTokens]=1

# Route 2: Notification Service
spring.cloud.gateway.server.webflux.routes[1].id=notification-service-route
spring.cloud.gateway.server.webflux.routes[1].uri=lb://Notification-Service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/notification/**