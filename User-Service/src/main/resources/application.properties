
# Core Application Configurations
spring.application.name=${SPRING_APPLICATION_NAME:my-spring-boot-service}
server.port=8080

# Database Configuration (PostgreSQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/microservices_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:prod_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:prod_secure_password_123}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool Settings (Production Tuning)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=20000

# Database Migrations (Flyway)
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.user=${spring.datasource.username}
spring.flyway.password=${spring.datasource.password}
spring.flyway.baseline-on-migrate=${SPRING_FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=0

# Look for SQL scripts inside src/main/resources/db/migration
spring.flyway.locations=classpath:db/migration


# Service Discovery (Eureka Client)
eureka.client.serviceUrl.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
# How often to send heartbeats to Eureka (Production defaults)
eureka.instance.lease-renewal-interval-in-seconds=30
eureka.instance.lease-expiration-duration-in-seconds=90


# Production Monitoring (Actuator Health Checks)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
