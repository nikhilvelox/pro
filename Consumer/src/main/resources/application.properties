spring.application.name=Consumer


# Kafka brokers
spring.kafka.bootstrap-servers=localhost:9092,localhost:9192

# Consumer configuration
spring.kafka.consumer.group-id=orders-consumer-group
spring.kafka.consumer.auto-offset-reset=earliest

# Default JSON deserialization
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# JSON trusted package
spring.kafka.consumer.properties[spring.json.trusted.packages]=com.example.kafkaconsumer.dto

# Default target Java class for JSON messages
spring.kafka.consumer.properties[spring.json.value.default.type]=com.example.kafkaconsumer.dto.Order

# Producer and consumer applications run on different ports
server.port=8081

